name: Diag Android sign-in
on:
  push:
    branches: [diag/android-signin]
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The store APK of release run 8 (versionCode 80)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40873991975 --repo ${{ github.repository }} -n store-android -D apk && ls -la apk/flutter-apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.midtrans.syriantariff/com.midtrans.midtrans_tariff.MainActivity
            sleep 45
            adb logcat -d > logcat.txt || true
            grep -iE "flutter|firebase|AndroidRuntime|FATAL|Exception" logcat.txt | tail -150 || true
            adb exec-out screencap -p > screen.png || true
            adb shell input tap 40 600
            sleep 3
            adb exec-out screencap -p > about.png || true
            adb shell input tap 280 600
            sleep 3
            adb logcat -c
            sleep 8
            adb shell input tap 24 52
            sleep 2
            adb exec-out screencap -p > account.png || true
            sleep 4
            adb exec-out screencap -p > account2.png || true
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml ui2.xml >/dev/null
            grep -oE 'content-desc="[^"]*"[^>]*bounds="[^"]*"' ui2.xml | grep -iE "apple|google|facebook" | sed -E 's/ (resource-id|class|package|checkable|checked|clickable|enabled|focusable|focused|scrollable|long-clickable|password|selected)="[^"]*"//g'
            A=$(grep -oE 'content-desc="[^"]*Apple[^"]*"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' ui2.xml | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -1)
            echo "apple bounds: $A"
            AX=$(echo "$A" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\1 \3/' | awk '{print int(($1+$2)/2)}')
            AY=$(echo "$A" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\2 \4/' | awk '{print int(($1+$2)/2)}')
            adb shell input tap ${AX:-160} ${AY:-495}
            sleep 12
            adb exec-out screencap -p > apple.png || true
            adb logcat -d > after-tap.txt || true
            grep -oE 'content-desc="[^"]+"' ui2.xml | head -30
            adb logcat -d | grep -iE " flutter|FirebaseAuth|Firebase not started" | tail -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: |
            logcat.txt
            screen.png
            account.png
            account2.png
            ui2.xml
            about.png
            after-tap.txt
            apple.png
