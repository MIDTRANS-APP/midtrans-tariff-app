name: Huawei small APK

# Run by hand, on this branch (gcc/main). Builds one store-signed APK for phones only
# (32- and 64-bit ARM, no x86_64 engine): about a third smaller than the universal
# APK, for uploading to AppGallery over a slow line. Same signing key as Release.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Android versionCode (must be higher than the one live on AppGallery)
        required: true
        default: "2"

jobs:
  android-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The upload key secrets are missing; store builds must be signed with it."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
      - env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number="$BUILD_NUMBER"
      - run: rm -f android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: huawei-arm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
