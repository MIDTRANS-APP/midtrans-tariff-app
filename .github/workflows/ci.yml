name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Test build for phones and Huawei devices (signed with the debug key; not for the stores).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: midtrans-tariff-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
